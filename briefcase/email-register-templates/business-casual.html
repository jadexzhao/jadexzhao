<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business casual email</title>
</head>
<body style="margin:0;padding:0;background-color:#f6efe3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6efe3;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;border:1px solid #c3d4de;">
        <tr>
          <td style="padding:32px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#222222;">
            Hi Priya,
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#333333;">
            Thanks for sending this over, really helpful. I'll take a look this afternoon and get back to you by tomorrow. Let me know if you need anything sooner.
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#333333;">
            Cheers,<br>
            Jade
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 24px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background-color:#4a90c4;width:36px;height:36px;border-radius:50%;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#ffffff;">JZ</td>
                <td style="padding-left:10px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#4a6b3d;">Jade Zhao</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
